[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "navantia_modelling"
version = "0.0.1"
description = "Convert the vibration environment into a pointing jitter (Phase 1 optical terminal, WBS 1.3)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["navantia_modelling"]
